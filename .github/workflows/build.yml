name: Build Android APK & AAB

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Verify Flutter
        run: flutter --version

      # 若仓库只有 Dart 代码,没有 android/ 平台壳,补一个最小壳
      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            echo "Scaffolding android/ via flutter create"
            cp lib/main.dart lib/main.dart.bak || true
            cp -r lib /tmp/lib.bak || true
            flutter create . --platforms android --org com.local --project-name chat_ai
            rm -rf lib/assets
            cp -r /tmp/lib.bak/* lib/
            rm -rf test/widget_test.dart
          fi

      - name: Enable R8 / minify / proguard
        run: |
          BUILD_GRADLE=android/app/build.gradle
          if [ -f "$BUILD_GRADLE" ]; then
            # 启用 minifyEnabled + shrinkResources
            sed -i 's/minifyEnabled false/minifyEnabled true/g' "$BUILD_GRADLE" || true
            sed -i 's/shrinkResources false/shrinkResources true/g' "$BUILD_GRADLE" || true
            # 若没有 shrinkResources 字段,追加
            if ! grep -q 'shrinkResources' "$BUILD_GRADLE"; then
              sed -i 's/minifyEnabled true/minifyEnabled true\n            shrinkResources true/g' "$BUILD_GRADLE"
            fi
          fi

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK (release, obfuscated, split per ABI)
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --split-per-abi \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Build App Bundle (release, obfuscated)
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-obfuscated
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release-obfuscated
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false