name: Build & Package 6-split Android binaries

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Verify Flutter
        run: flutter --version

      # 脚手架(仓库内无 android/)
      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            echo "Scaffolding android/ via flutter create"
            cp lib/main.dart lib/main.dart.bak || true
            cp -r lib /tmp/lib.bak || true
            flutter create . --platforms android --org com.local --project-name chat_ai
            rm -rf lib/assets
            cp -r /tmp/lib.bak/* lib/
            rm -rf test/widget_test.dart
          fi

      # R8 + minify + shrinkResources
      - name: Enable R8 / minify / proguard
        run: |
          BUILD_GRADLE=android/app/build.gradle
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' "$BUILD_GRADLE" || true
            sed -i 's/shrinkResources false/shrinkResources true/g' "$BUILD_GRADLE" || true
            if ! grep -q 'shrinkResources' "$BUILD_GRADLE"; then
              sed -i 's/minifyEnabled true/minifyEnabled true\n            shrinkResources true/g' "$BUILD_GRADLE"
            fi
          fi

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # ---- 1) 单 ABI APK ×3 ----
      - name: Build APK arm64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Build APK armv7
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Build APK x86_64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      # ---- 2) 单 ABI AAB ×3 (per-ABI AAB 需要 --target-platform) ----
      - name: Build AAB arm64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Build AAB armv7
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Build AAB x86_64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      # ---- 3) 安装 7z + zip,收集产物 ----
      - name: Install p7zip-full + zip
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full zip

      - name: Stage artifacts
        run: |
          mkdir -p stage
          # 找文件
          for abi in arm64 armv7 x64; do
            case $abi in
              arm64)  tag="arm64-v8a"; pat="arm64-v8a";;
              armv7)  tag="armeabi-v7a"; pat="armeabi-v7a";;
              x64)    tag="x86_64";    pat="x86_64";;
            esac
            for kind in apk aab; do
              ext=$( [ "$kind" = "apk" ] && echo apk || echo aab )
              src=$( find build/app/outputs -type f -name "*${pat}*.${ext}" | head -1 )
              if [ -z "$src" ]; then
                echo "WARN: not found *${pat}*.${ext}"
                ls -la build/app/outputs 2>/dev/null || true
                find build/app/outputs -type f 2>/dev/null | head -20
                continue
              fi
              cp "$src" "stage/chat-ai-${abi}.${ext}"
              echo "staged $(basename $src) -> stage/chat-ai-${abi}.${ext} ($(du -h $src | cut -f1))"
            done
          done
          ls -lh stage/

      # ---- 4) 极限压缩: 7z (-mx=9) + zip (-9) ----
      - name: 7z ultra compression
        run: |
          cd stage
          for f in chat-ai-*; do
            7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on "${f}.7z" "$f" >/dev/null
            sz=$(du -b "${f}.7z" | cut -f1)
            echo "7z ${f}: $((sz/1024)) KB"
          done
          ls -lh *.7z

      - name: zip max compression
        run: |
          cd stage
          for f in chat-ai-*; do
            zip -9 -X -q "${f}.zip" "$f"
            sz=$(du -b "${f}.zip" | cut -f1)
            echo "zip ${f}: $((sz/1024)) KB"
          done
          ls -lh *.zip

      # ---- 5) 上传所有包(每个独立 artifact)----
      - name: Upload arm64 APK 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-arm64-apk-7z
          path: stage/chat-ai-arm64.apk.7z
          if-no-files-found: warn

      - name: Upload arm64 APK zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-arm64-apk-zip
          path: stage/chat-ai-arm64.apk.zip
          if-no-files-found: warn

      - name: Upload armv7 APK 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-armv7-apk-7z
          path: stage/chat-ai-armv7.apk.7z
          if-no-files-found: warn

      - name: Upload armv7 APK zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-armv7-apk-zip
          path: stage/chat-ai-armv7.apk.zip
          if-no-files-found: warn

      - name: Upload x64 APK 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-x64-apk-7z
          path: stage/chat-ai-x64.apk.7z
          if-no-files-found: warn

      - name: Upload x64 APK zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-x64-apk-zip
          path: stage/chat-ai-x64.apk.zip
          if-no-files-found: warn

      - name: Upload AAB 7z (all 3 ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-aab-7z
          path: stage/*.aab.7z
          if-no-files-found: warn

      - name: Upload AAB zip (all 3 ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-aab-zip
          path: stage/*.aab.zip
          if-no-files-found: warn

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stage/*.7z
            stage/*.zip
          fail_on_unmatched_files: false