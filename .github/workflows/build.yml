name: Build & Package 6-split Android binaries

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Verify Flutter
        run: flutter --version

      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            cp lib/main.dart lib/main.dart.bak || true
            cp -r lib /tmp/lib.bak || true
            flutter create . --platforms android --org com.local --project-name chat_ai
            rm -rf lib/assets
            cp -r /tmp/lib.bak/* lib/
            rm -rf test/widget_test.dart
          fi

      - name: Enable R8 / minify / proguard
        run: |
          BUILD_GRADLE=android/app/build.gradle
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' "$BUILD_GRADLE" || true
            sed -i 's/shrinkResources false/shrinkResources true/g' "$BUILD_GRADLE" || true
            if ! grep -q 'shrinkResources' "$BUILD_GRADLE"; then
              sed -i 's/minifyEnabled true/minifyEnabled true\n            shrinkResources true/g' "$BUILD_GRADLE"
            fi
          fi

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Install p7zip-full + zip
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full zip

      # ---- 6 个独立 build: 3 ABI × 2 format ----
      # 每个 build 完立刻 stage + 清空 build 输出目录,避免下次覆盖

      - name: Build APK arm64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Stage arm64 APK
        run: |
          mkdir -p stage
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} stage/chat-ai-arm64.apk \;
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk
          ls -lh stage/

      - name: Build APK armv7
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Stage armv7 APK
        run: |
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} stage/chat-ai-armv7.apk \;
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk
          ls -lh stage/

      - name: Build APK x86_64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Stage x64 APK
        run: |
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} stage/chat-ai-x64.apk \;
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk
          ls -lh stage/

      - name: Build AAB arm64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Stage arm64 AAB
        run: |
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-arm64.aab \;
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk

      - name: Build AAB armv7
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Stage armv7 AAB
        run: |
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-armv7.aab \;
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk

      - name: Build AAB x86_64
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64 \
            --dart-define=API_ENDPOINT="$API_ENDPOINT" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=API_MODEL="$API_MODEL"

      - name: Stage x64 AAB
        run: |
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-x64.aab \;
          ls -lh stage/

      # ---- 压缩: 7z ultra + zip max ----
      - name: 7z ultra compression
        run: |
          cd stage
          for f in chat-ai-*; do
            7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on "${f}.7z" "$f" >/dev/null
            sz=$(du -b "${f}.7z" | cut -f1)
            echo "7z ${f}: $((sz/1024)) KB"
          done
          ls -lh *.7z

      - name: zip max compression
        run: |
          cd stage
          for f in chat-ai-*; do
            zip -9 -X -q "${f}.zip" "$f"
            sz=$(du -b "${f}.zip" | cut -f1)
            echo "zip ${f}: $((sz/1024)) KB"
          done
          ls -lh *.zip

      # ---- 上传 12 个独立包 ----
      - name: Upload arm64 APK 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-arm64-apk-7z
          path: stage/chat-ai-arm64.apk.7z
          if-no-files-found: error

      - name: Upload arm64 APK zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-arm64-apk-zip
          path: stage/chat-ai-arm64.apk.zip
          if-no-files-found: error

      - name: Upload armv7 APK 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-armv7-apk-7z
          path: stage/chat-ai-armv7.apk.7z
          if-no-files-found: error

      - name: Upload armv7 APK zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-armv7-apk-zip
          path: stage/chat-ai-armv7.apk.zip
          if-no-files-found: error

      - name: Upload x64 APK 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-x64-apk-7z
          path: stage/chat-ai-x64.apk.7z
          if-no-files-found: error

      - name: Upload x64 APK zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-x64-apk-zip
          path: stage/chat-ai-x64.apk.zip
          if-no-files-found: error

      - name: Upload arm64 AAB 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-arm64-aab-7z
          path: stage/chat-ai-arm64.aab.7z
          if-no-files-found: error

      - name: Upload arm64 AAB zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-arm64-aab-zip
          path: stage/chat-ai-arm64.aab.zip
          if-no-files-found: error

      - name: Upload armv7 AAB 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-armv7-aab-7z
          path: stage/chat-ai-armv7.aab.7z
          if-no-files-found: error

      - name: Upload armv7 AAB zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-armv7-aab-zip
          path: stage/chat-ai-armv7.aab.zip
          if-no-files-found: error

      - name: Upload x64 AAB 7z
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-x64-aab-7z
          path: stage/chat-ai-x64.aab.7z
          if-no-files-found: error

      - name: Upload x64 AAB zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-x64-aab-zip
          path: stage/chat-ai-x64.aab.zip
          if-no-files-found: error

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: ignore

      - name: Attach all to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stage/*.7z
            stage/*.zip
          fail_on_unmatched_files: false