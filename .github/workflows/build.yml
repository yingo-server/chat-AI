      - name: Pub get
        run: flutter pub get

      - name: Generate vault.bin locally (no cross-job artifact dependency)
        env:
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$VAULT_MASTER" ]; then
            echo "::error::VAULT_MASTER secret is required"; exit 1
          fi
          dart run tools/encrypt_secrets.dart \
            --endpoint="$API_ENDPOINT" \
            --key="$API_KEY" \
            --master="$VAULT_MASTER" \
            --out=assets/vault.bin
          test -s assets/vault.bin || (echo "::error::vault.bin missing"; exit 1)
          if strings assets/vault.bin | grep -qE "server\.344977|wbk_"; then
            echo "::error::plaintext found in vault.bin"; exit 1
          fi
          ls -lh assets/vault.bin

      - name: Vault host self-test (runs the REAL C++ chain, live logs)
        env:
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -x
          python3 tools/gen_master_header.py --master="$VAULT_MASTER" --out=tools/vault_master.h
          g++ --version | head -1
          g++ -std=c++17 -I tools/android_shim -I tools -O0 -g \
              -o /tmp/vault_host_test tools/vault_host_test.cpp tools/vault.cpp
          /tmp/vault_host_test --vault=assets/vault.bin \
              --expect-endpoint="$API_ENDPOINT" --expect-key="$API_KEY"
          ls -lh assets/vault.bin

      - name: Setup release signing + master header
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
          cat > android/key.properties <<EOF
          storeFile=$HOME/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 tools/gen_master_header.py \
            --master="$VAULT_MASTER" \
            --out=android/app/src/main/cpp/vault_master.h
          unset KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD VAULT_MASTER
          ls -lh android/app/src/main/cpp/vault_master.h android/key.properties

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Detect Android NDK
        id: ndk
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT" 2>/dev/null || true
          FOUND="$(ls "$SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -1 || true)"
          echo "preinstalled NDK: '${FOUND}'"
          echo "version=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Install NDK r26d (only when the runner has none)
        id: install_ndk
        if: steps.ndk.outputs.version == ''
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Pin ndkVersion in android/app/build.gradle
        env:
          DETECTED: ${{ steps.ndk.outputs.version }}
          NDK_HOME_OUT: ${{ steps.install_ndk.outputs.ndk-path }}
        run: |
          if [ -n "$DETECTED" ]; then
            VER="$DETECTED"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            VER="$(basename "$ANDROID_NDK_HOME")"
          elif [ -n "$NDK_HOME_OUT" ]; then
            VER="$(basename "$NDK_HOME_OUT")"
          else
            echo "::error::no Android NDK available"; exit 1
          fi
          echo "using NDK: $VER"
          sed -i "s/ndkVersion \".*\"/ndkVersion \"$VER\"/" android/app/build.gradle
          grep -n 'ndkVersion' android/app/build.gradle

      - name: Install p7zip-full + zip
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full zip

      - name: Build APK x86_64
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64 || exit 1
          mkdir -p stage
          ls build/app/outputs/flutter-apk/*.apk | head -1 | xargs -I{} cp {} stage/chat-ai-x64.apk
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-x64.aab \; 2>/dev/null || true

      - name: Build AAB x86_64
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-x64.aab \;

      - name: Compress
        run: |
          cd stage
          for f in chat-ai-*; do
            7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on "${f}.7z" "$f" >/dev/null
          done
          for f in chat-ai-*.apk chat-ai-*.aab; do
            [ -e "$f" ] || continue
            zip -9 -X -q "${f}.zip" "$f"
          done
          ls -lh
        continue-on-error: true

      - name: Attach x64 packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            stage/*.7z
            stage/*.zip
