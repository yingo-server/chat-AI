name: Build Android APK & AAB

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Verify Flutter
        run: flutter --version

      # 若仓库只有 Dart 代码,没有 android/ 平台壳,补一个最小壳
      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            echo "Scaffolding android/ via flutter create"
            # 备份现有的 main.dart(脚手架会覆盖)
            cp lib/main.dart lib/main.dart.bak || true
            # 把整个 lib/assets 备份
            cp -r lib /tmp/lib.bak || true
            flutter create . --platforms android --org com.local --project-name chat_ai
            # 恢复真正的项目文件
            rm -rf lib/assets
            cp -r /tmp/lib.bak/* lib/
            rm -rf test/widget_test.dart
          fi

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK (release, split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false