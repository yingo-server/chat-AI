name: Build Android APK & AAB

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 加速镜像 — 所有外部走 proxy.344977.xyz
  PUB_HOSTED_URL: https://proxy.344977.xyz/pub.dev
  FLUTTER_STORAGE_BASE_URL: https://proxy.344977.xyz/flutter_infra_release
  ANDROID_MAVEN_MIRROR: https://maven.proxy.344977.xyz/dl/android/maven2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle mirrors
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven.proxy.344977.xyz/dl/android/maven2/' }
                      maven { url 'https://maven.proxy.344977.xyz/google/' }
                      mavenCentral()
                      google()
                  }
              }
              repositories {
                  maven { url 'https://maven.proxy.344977.xyz/dl/android/maven2/' }
                  maven { url 'https://maven.proxy.344977.xyz/google/' }
                  mavenCentral()
                  google()
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url 'https://maven.proxy.344977.xyz/dl/android/maven2/gradle-plugins/' }
                      gradlePluginPortal()
                  }
              }
          }
          GRADLE

      # 直接从镜像下载 Flutter tar.xz,绕过 subosito action 的 GitHub API 调用
      - name: Install Flutter
        run: |
          set -e
          FLUTTER_VERSION="3.24.5"
          FLUTTER_URL="https://proxy.344977.xyz/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "Downloading $FLUTTER_URL"
          mkdir -p /opt
          curl -fL --connect-timeout 30 -o /tmp/flutter.tar.xz "$FLUTTER_URL"
          ls -lh /tmp/flutter.tar.xz
          tar -xJf /tmp/flutter.tar.xz -C /opt
          mv /opt/flutter /opt/flutter
          echo "FLUTTER_HOME=/opt/flutter" >> $GITHUB_ENV
          echo "PATH=/opt/flutter/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Flutter
        run: flutter --version

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK (release, split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false