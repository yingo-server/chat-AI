name: Build & Package Android (per-ABI parallel)

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # ---- 一次:生成 vault.bin + 装依赖 ----
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: stable }

      - name: Pub get
        run: flutter pub get

      - name: Encrypt secrets into vault.bin
        id: gen_vault
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
        run: |
          if [ -z "$VAULT_MASTER" ]; then
            echo "::error::VAULT_MASTER secret is required"
            exit 1
          fi
          dart run tools/encrypt_secrets.dart \
            --endpoint="$API_ENDPOINT" \
            --key="$API_KEY" \
            --master="$VAULT_MASTER" \
            --out=assets/vault.bin
          unset API_KEY API_ENDPOINT VAULT_MASTER
          ls -lh assets/vault.bin

      - name: Verify vault.bin (no plaintext)
        run: |
          if strings assets/vault.bin | grep -E "server\.344977|00000000|wbk_" ; then
            echo "::error::vault.bin contains plaintext secrets!"; exit 1
          fi
          echo "vault.bin OK (no plaintext)"


      - name: Vault host self-test (runs the REAL C++ chain, live logs)
        env:
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -x
          python3 tools/gen_master_header.py --master="$VAULT_MASTER" --out=tools/vault_master.h
          g++ --version | head -1
          g++ -std=c++17 -I tools/android_shim -I tools -O0 -g \
              -o /tmp/vault_host_test tools/vault_host_test.cpp tools/vault.cpp
          /tmp/vault_host_test --vault=assets/vault.bin \
              --expect-endpoint="$API_ENDPOINT" --expect-key="$API_KEY"

      - name: Prompt injection smoke test (live request, logs prove the system prompt is sent)
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
        run: |
          # 用与 App 相同的密钥流解出 endpoint/key(证明 vault 链路可用)
          dart run tools/encrypt_secrets.dart \
            --endpoint="$API_ENDPOINT" --key="$API_KEY" \
            --master="$VAULT_MASTER" --out=/tmp/v.bin >/dev/null

          # 生成与 buildPrompt 一致的请求体:system 在 messages[0]
          python3 - <<'PYEOF'
          import json, os
          sys_prompt = json.load(open('assets/config.example.json'))['systemPrompts'][0]['content']
          body = {
            'model': os.environ['API_MODEL'],
            'temperature': 0.7, 'max_tokens': 512, 'stream': False,
            'reasoning_effort': 'high',
            'messages': [
              {'role': 'system', 'content': sys_prompt},
              {'role': 'system', 'content': sys_prompt},
              {'role': 'user', 'content': '你好'},
            ],
          }
          json.dump(body, open('/tmp/req.json', 'w'), ensure_ascii=False)
          print('request messages[0].role =', body['messages'][0]['role'],
                '| system chars =', len(sys_prompt))
          PYEOF

          ENDPOINT="${API_ENDPOINT%/}/chat/completions"
          export ENDPOINT_URL="$ENDPOINT"
          echo "POST $ENDPOINT"
          curl -s --max-time 90 -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/req.json > /tmp/resp.json
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/resp.json'))
          c = d['choices'][0]['message']['content']
          print('response chars:', len(c))
          print('response head :', c[:80].replace('\n', ' '))
          # 双探针判定(长度启发式会被网关波动误报):
          #  system 探针成功  -> 注入链路 OK
          #  system 失败但 user 成功 -> 网关正在丢弃/降权 system 消息
          #  两者都失败      -> 网关/模型本身异常
          import urllib.request
          def probe(role):
              body = {'model': __import__('os').environ['API_MODEL'],
                      'max_tokens': 512, 'reasoning_effort': 'high',
                      'messages': [{'role': role, 'content':
                        'Start your reply with the exact token [CH-CONFIRMED]. Now: who are you?'}]}
              req = urllib.request.Request(
                  __import__('os').environ['ENDPOINT_URL'],
                  data=json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + __import__('os').environ['API_KEY'],
                           'Content-Type': 'application/json'})
              r = json.loads(urllib.request.urlopen(req, timeout=90).read())
              return '[CH-CONFIRMED]' in r['choices'][0]['message'].get('content', '')
          os_ok = probe('system')
          u_ok = probe('user')
          print(f'probe(system)={os_ok} probe(user)={u_ok}')
          if os_ok:
              print('PASS: system prompt is applied by the gateway')
          elif u_ok:
              print('FAIL: the gateway is dropping/degrading system messages '
                    '(user-channel probes pass, system-channel does not)')
              raise SystemExit(2)
          else:
              print('FAIL: gateway/model not following instructions at all')
              raise SystemExit(3)
          PYEOF

      - name: Create the release skeleton (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Chat ${{ github.ref_name }}
          body: |
            AI Chat for Android — Flutter + native vault

            - 3 ABIs x 2 formats (APK / AAB) x 2 compression (7z / zip)
            - Endpoint and API key are encrypted in assets/vault.bin and decrypted
              inside libvault.so; the master key is embedded obfuscated in the
              native library and never stored in the repository
            - Flutter --obfuscate + R8 minify + resource shrinking, release signed
            - Material 3 UI, local SQLite storage, Markdown rendering,
              streaming fade-in, configurable output speed
            - Model: cn:deepseek-v4-flash (1M context)
          fail_on_unmatched_files: false
          files: |
            README.md

  build-arm64:
    needs: prep
    if: needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: stable }

      - name: Ensure Android platform + cpp
        run: |
          if [ ! -d android ]; then
            cp lib/main.dart lib/main.dart.bak || true
            cp -r lib /tmp/lib.bak || true
            flutter create . --platforms android --org com.local --project-name chat_ai
            rm -rf lib/assets
            cp -r /tmp/lib.bak/* lib/
            rm -rf test/widget_test.dart
          fi
          cp tools/app.build.gradle android/app/build.gradle
          cp tools/gradle.properties android/gradle.properties
          cp tools/proguard-rules.pro android/app/proguard-rules.pro
          mkdir -p android/app/src/main/res
          # 整套资源:自适应图标(anydpi-v26)+ 各密度 PNG(旧启动器回退)
          cp -r tools/res/. android/app/src/main/res/
          cp tools/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/cpp
          cp tools/vault.cpp android/app/src/main/cpp/vault.cpp
          cp tools/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minifyEnabled false/minifyEnabled true/g' android/app/build.gradle
          sed -i 's/shrinkResources false/shrinkResources true/g' android/app/build.gradle

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Generate vault.bin locally (no cross-job artifact dependency)
        env:
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$VAULT_MASTER" ]; then
            echo "::error::VAULT_MASTER secret is required"; exit 1
          fi
          dart run tools/encrypt_secrets.dart \
            --endpoint="$API_ENDPOINT" \
            --key="$API_KEY" \
            --master="$VAULT_MASTER" \
            --out=assets/vault.bin
          test -s assets/vault.bin || (echo "::error::vault.bin missing"; exit 1)
          if strings assets/vault.bin | grep -qE "server\.344977|wbk_"; then
            echo "::error::plaintext found in vault.bin"; exit 1
          fi
          ls -lh assets/vault.bin

      - name: Vault host self-test (runs the REAL C++ chain, live logs)
        env:
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -x
          python3 tools/gen_master_header.py --master="$VAULT_MASTER" --out=tools/vault_master.h
          g++ --version | head -1
          g++ -std=c++17 -I tools/android_shim -I tools -O0 -g \
              -o /tmp/vault_host_test tools/vault_host_test.cpp tools/vault.cpp
          /tmp/vault_host_test --vault=assets/vault.bin \
              --expect-endpoint="$API_ENDPOINT" --expect-key="$API_KEY"
          ls -lh assets/vault.bin

      - name: Setup release signing + master header
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
          cat > android/key.properties <<EOF
          storeFile=$HOME/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 tools/gen_master_header.py \
            --master="$VAULT_MASTER" \
            --out=android/app/src/main/cpp/vault_master.h
          unset KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD VAULT_MASTER
          ls -lh android/app/src/main/cpp/vault_master.h android/key.properties

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Detect Android NDK
        id: ndk
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT" 2>/dev/null || true
          FOUND="$(ls "$SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -1 || true)"
          echo "preinstalled NDK: '${FOUND}'"
          echo "version=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Install NDK r26d (only when the runner has none)
        id: install_ndk
        if: steps.ndk.outputs.version == ''
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Pin ndkVersion in android/app/build.gradle
        env:
          DETECTED: ${{ steps.ndk.outputs.version }}
          NDK_HOME_OUT: ${{ steps.install_ndk.outputs.ndk-path }}
        run: |
          if [ -n "$DETECTED" ]; then
            VER="$DETECTED"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            VER="$(basename "$ANDROID_NDK_HOME")"
          elif [ -n "$NDK_HOME_OUT" ]; then
            VER="$(basename "$NDK_HOME_OUT")"
          else
            echo "::error::no Android NDK available"; exit 1
          fi
          echo "using NDK: $VER"
          sed -i "s/ndkVersion \".*\"/ndkVersion \"$VER\"/" android/app/build.gradle
          grep -n 'ndkVersion' android/app/build.gradle

      - name: Install p7zip-full + zip
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full zip

      - name: Build APK arm64
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64 || exit 1
          mkdir -p stage
          ls build/app/outputs/flutter-apk/*.apk | head -1 | xargs -I{} cp {} stage/chat-ai-arm64.apk
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-arm64.aab \; 2>/dev/null || true

      - name: Build AAB arm64
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-arm64.aab \;

      - name: Compress
        run: |
          cd stage
          for f in chat-ai-*; do
            7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on "${f}.7z" "$f" >/dev/null
          done
          for f in chat-ai-*.apk chat-ai-*.aab; do
            [ -e "$f" ] || continue
            zip -9 -X -q "${f}.zip" "$f"
          done
          ls -lh
        continue-on-error: true

      - name: Attach arm64 packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            stage/*.7z
            stage/*.zip

