  # ---- Release:任一 build 成功就发布 ----
  release:
    needs:
      - build-arm64
      - build-armv7
      - build-x64
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all per-ABI packages
        uses: actions/download-artifact@v4
        with:
          path: release-stage
          pattern: chat-ai-*-packages
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded packages
        run: |
          find release-stage -type f 2>/dev/null | head -20
          echo "---"
          du -sh release-stage 2>/dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag: ${{ github.ref_name }}
          name: "AI Chat ${{ github.ref_name }}"
          body: |
            AI Chat — Flutter + native vault

            - 3 ABIs × 2 formats (APK / AAB) × 2 compression (7z / zip) — up to 12 packages
            - Endpoint / API key encrypted in native libvault.so (AES-256-CTR)
            - Master key in Android Keystore
            - Anti-debug / anti-root / anti-emulator detection
            - Flutter --obfuscate + R8 + ProGuard 5-pass
            - Model: cn:deepseek-v4-flash (1M ctx, reasoning_effort toggled per turn)
          fail_on_unmatched_files: true
          files: |
            release-stage/**/*.7z
            release-stage/**/*.zip