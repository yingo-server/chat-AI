name: Build & Package 6-split Android binaries

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Verify Flutter
        run: flutter --version

      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            cp lib/main.dart lib/main.dart.bak || true
            cp -r lib /tmp/lib.bak || true
            flutter create . --platforms android --org com.local --project-name chat_ai
            rm -rf lib/assets
            cp -r /tmp/lib.bak/* lib/
            rm -rf test/widget_test.dart
          fi
          # 替换默认 build.gradle 为带 native build 的版本
          cp tools/app.build.gradle android/app/build.gradle
          # 替换 gradle.properties
          cp tools/gradle.properties android/gradle.properties
          # 替换 proguard-rules.pro
          cp tools/proguard-rules.pro android/app/proguard-rules.pro
          # 拷 cpp 源
          mkdir -p android/app/src/main/cpp
          cp tools/vault.cpp android/app/src/main/cpp/vault.cpp
          cp tools/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          # 设置 minSdkVersion 23
          sed -i 's/minSdkVersion 21/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Enable R8 / minify / proguard
        run: |
          BUILD_GRADLE=android/app/build.gradle
          sed -i 's/minifyEnabled false/minifyEnabled true/g' "$BUILD_GRADLE" || true
          sed -i 's/shrinkResources false/shrinkResources true/g' "$BUILD_GRADLE" || true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      # ---- 关键步骤:加密 secrets 生成 vault.bin ----
      - name: Encrypt secrets into vault.bin
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          API_KEY: ${{ secrets.API_KEY }}
          API_MODEL: ${{ secrets.API_MODEL }}
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
        run: |
          if [ -z "$VAULT_MASTER" ]; then
            echo "::error::VAULT_MASTER secret is required"
            exit 1
          fi
          dart run tools/encrypt_secrets.dart \
            --endpoint="$API_ENDPOINT" \
            --key="$API_KEY" \
            --master="$VAULT_MASTER" \
            --out=assets/vault.bin
          # 立刻清掉环境变量
          unset API_KEY API_ENDPOINT VAULT_MASTER
          ls -lh assets/vault.bin

      - name: Verify vault.bin
        run: |
          # 必须能 grep 到 VLT1 魔数
          head -c 4 assets/vault.bin | xxd | head -1
          # 不能有明文 endpoint/key
          if strings assets/vault.bin | grep -E "server\.344977|00000000|wbk_" ; then
            echo "::error::vault.bin contains plaintext secrets!"
            exit 1
          fi
          echo "vault.bin OK (no plaintext)"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Install p7zip-full + zip
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full zip

      - name: Build APK arm64
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64
          mkdir -p stage
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} stage/chat-ai-arm64.apk \;
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-arm64.aab \; 2>/dev/null || true
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk

      - name: Build APK armv7
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} stage/chat-ai-armv7.apk \;
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-armv7.aab \; 2>/dev/null || true
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk

      - name: Build APK x86_64
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} stage/chat-ai-x64.apk \;
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-x64.aab \; 2>/dev/null || true
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk

      - name: Build AAB arm64
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm64
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-arm64.aab \;
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk

      - name: Build AAB armv7
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-arm
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-armv7.aab \;
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/app/outputs/apk

      - name: Build AAB x86_64
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --target-platform=android-x64
          find build/app/outputs/bundle -name "*.aab" -exec cp {} stage/chat-ai-x64.aab \;
          ls -lh stage/

      - name: 7z ultra compression
        run: |
          cd stage
          for f in chat-ai-*; do
            7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on "${f}.7z" "$f" >/dev/null
            sz=$(du -b "${f}.7z" | cut -f1)
            echo "7z ${f}: $((sz/1024)) KB"
          done

      - name: zip max compression
        run: |
          cd stage
          for f in chat-ai-*.apk chat-ai-*.aab; do
            [ -e "$f" ] || continue
            zip -9 -X -q "${f}.zip" "$f"
            sz=$(du -b "${f}.zip" | cut -f1)
            echo "zip ${f}: $((sz/1024)) KB"
          done
          ls -lh

      - name: Upload all
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-packages
          path: stage/
          if-no-files-found: error

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag: ${{ github.ref_name }}
          name: "AI Chat ${{ github.ref_name }}"
          body: |
            AI Chat — Flutter + native vault
            - 3 ABIs × 2 formats × 2 compression (7z/zip) — 12 packages
            - Endpoint / API key encrypted in native libvault.so (AES-256-CTR)
            - Master key stored in Android Keystore
            - Anti-debug / anti-root / anti-emulator detection
            - Flutter --obfuscate + R8 + ProGuard 5-pass
            - Model: cn:deepseek-v4.1-flash (1M ctx)
          fail_on_unmatched_files: false
          files: |
            stage/*.7z
            stage/*.zip