name: ai_flutter
description: AI Chat - Flutter rewrite, Material 3, local-only storage.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Networking
  http: ^1.2.2

  # Crypto (用于密钥混淆,防 grep)
  crypto: ^3.0.5

  # UI / utilities
  flutter_markdown: ^0.7.3
  intl: ^0.19.0
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/